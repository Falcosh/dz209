{% extends 'blog/base.html' %}

{% block title %}Удаление поста — Мой блог{% endblock %}

{% block content %}
<div class="card">
    <h1>Удалить пост?</h1>
    <p>Вы уверены, что хотите удалить пост «{{ post.title }}»?</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a class="btn btn-secondary" href="{% url 'post_detail' post.pk %}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
